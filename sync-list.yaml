  #   # 在MkDocs中的目标目录名（可选，默认为文件名）
  #   target_dir: "go-advanced-programming"
  #   # 关联的图片目录（相对Hugo根目录）
  #   images:
  #     - "static/post-images/《Go语言高级编程》阅读笔记/"
  #   # 额外配置（可选）
  #   config:
  #     split_by_h2: true  # 是否按二级标题拆分章节
  #     frontmatter:
  #       - "date"
  #       - "tags"

  # # 示例配置2：简化配置
  # - source: "content/posts/2024/《设计模式之美》笔记.md"
  #   images:
  #     - "static/post-images/《设计模式之美》笔记/"

  # # 示例配置3：多个图片目录
  # - source: "content/posts/2023/深入理解Kubernetes.md"
