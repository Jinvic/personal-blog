  #     - "static/post-images/kubernetes/"
  #     - "static/images/k8s-diagrams/"

  - source: "content/posts/2025/《Go语言高级编程》阅读笔记.md"
    images:
      - "static/post-images/《Go语言高级编程》阅读笔记/"

# 全局配置
global:
  # MkDocs仓库信息（GitHub Actions中使用的变量）
  mkdocs_repo: "jinvic/read-notes"  # 替换为你的MkDocs仓库
  mkdocs_branch: "main"
  
  # 图片处理配置
  image_base_path: "assets/images"  # MkDocs中图片的基础路径
  
  # 转换选项
  default_split_by_h2: true
  # preserve_frontmatter: ["date", "tags", "categories"]
  
# 忽略列表（如果不想同步某些已配置的文章）
# ignore:
#   - "content/posts/2022/旧笔记.md"