name: Sync Reading Notes to MkDocs

on:
  push:
    branches: [ main, master ]
    # 注意：这里不需要路径过滤，由脚本检查
  # 允许手动触发
  workflow_dispatch:
    inputs:
      force_sync_all:
        description: '强制同步所有笔记'
        required: false
        default: false
        type: boolean

# 设置权限
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    # 并发控制：同一分支的多次提交只运行最新的
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 用于比较提交差异
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      
      - name: 检查笔记变更
        id: check
        run: |
          python scripts/check_notes.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 判断是否需要同步
        id: decision
        run: |
          # 如果是手动触发且选择了强制同步，则执行同步
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.force_sync_all }}" == "true" ]]; then
            echo "🚀 手动触发：强制同步所有笔记"
            echo "should_sync=true" >> $GITHUB_OUTPUT
            echo "sync_reason=manual_force" >> $GITHUB_OUTPUT
          # 如果检测到笔记变更，则执行同步
          elif [[ "${{ steps.check.outputs.has_changes }}" == "true" ]]; then
            echo "📝 检测到笔记变更，开始同步"
            echo "should_sync=true" >> $GITHUB_OUTPUT
            echo "sync_reason=notes_changed" >> $GITHUB_OUTPUT
          else
            echo "⏭️  无笔记变更，跳过同步"
            echo "should_sync=false" >> $GITHUB_OUTPUT
            echo "sync_reason=no_changes" >> $GITHUB_OUTPUT
          fi
      
      - name: 准备同步数据
        if: steps.decision.outputs.should_sync == 'true'
        run: |
          echo "需要同步的笔记数量: ${{ steps.check.outputs.changed_notes_count || 0 }}"
          
          # 创建临时文件存储同步数据
          mkdir -p .github/sync-data
          
          # 如果是强制同步，加载所有笔记配置
          if [[ "${{ steps.decision.outputs.sync_reason }}" == "manual_force" ]]; then
            echo "🔄 强制同步模式：加载所有笔记"
            python -c "
            import yaml, json
            with open('sync-list.yaml', 'r', encoding='utf-8') as f:
                config = yaml.safe_load(f)
            notes = config.get('notes', [])
            print(f'共 {len(notes)} 篇笔记')
            with open('.github/sync-data/notes.json', 'w', encoding='utf-8') as f:
                json.dump(notes, f, ensure_ascii=False, indent=2)
            "
          else
            # 使用检测到的变更笔记
            echo '${{ steps.check.outputs.changed_notes_json }}' > .github/sync-data/notes.json
          fi
          
          # 保存MkDocs仓库信息
          echo '${{ secrets.MKDOCS_REPO }}' > .github/sync-data/mkdocs_repo.txt
          echo '${{ secrets.MKDOCS_TOKEN }}' > .github/sync-data/mkdocs_token.txt
      
      - name: 同步到MkDocs仓库
        if: steps.decision.outputs.should_sync == 'true'
        env:
          MKDOCS_REPO: ${{ secrets.MKDOCS_REPO }}
          MKDOCS_TOKEN: ${{ secrets.MKDOCS_TOKEN }}
          HUGO_REPO: ${{ github.repository }}
          HUGO_COMMIT: ${{ github.sha }}
        run: |
          echo "🚀 开始同步到MkDocs仓库..."
          
          # 这里应该是实际的同步逻辑
          # 由于我们分离了职责，这里只负责触发MkDocs仓库的工作流
          
          # 触发MkDocs仓库的同步工作流
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $MKDOCS_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$MKDOCS_REPO/actions/workflows/sync-from-hugo.yml/dispatches" \
            -d "{
              \"ref\": \"main\",
              \"inputs\": {
                \"hugo_repo\": \"$HUGO_REPO\",
                \"hugo_commit\": \"$HUGO_COMMIT\",
                \"sync_reason\": \"${{ steps.decision.outputs.sync_reason }}\",
                \"notes_json\": $(cat .github/sync-data/notes.json | jq -R -s '.')
              }
            }"
          
          echo "✅ 已触发MkDocs仓库同步工作流"
      
